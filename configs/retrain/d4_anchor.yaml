# D4 pair 앵커 재매개화 — 디코더 좌표를 그 쌍의 그룹 평균 경로 기준으로 바꾼다
#
# 문제 (실측)
# -----------
#   전역 뇌 박스        152 x 189 x 163 mm   부피 4.68e6
#   upstream 번들 박스   83 x 121 x 100      부피 1.17e6   (번들마다 supp/*_coords_*.npy 로 따로)
#   실제 ROI 쌍 GT 범위  43 x  71 x  61      부피 1.67e5
#   앵커 박스 (valid 1569개)                              -> 전역 대비 **39배 축소**
#
# 디코더 복원은 3.08mm 로 GT 잡음 바닥(pair 천장 MDF 3.92mm)에 이미 닿아 있으므로 디코더
# 용량 문제가 아니다. 피해자는 **prior** 다: 좌표가 전뇌 절대값이라 64-d z 가 "3,321 쌍 중
# 어느 것 + 뇌 어디쯤 + 모양"을 전부 떠안는다. upstream 은 번들 정체성이 30개 모델 가중치에
# 있어서 z 는 번들 *내부* 변이만 담으면 됐다. prior NLL 71.6 vs arch_additive 15.6,
# 생성 MDF 19.5 vs 오라클 3 의 구조적 이유가 이것이다.
#
# 재매개화:  mm = anchor[pair] + half_range[pair] * raw     (raw = tanh, [-1,1])
#
# 왜 램프업인가: 재매개화는 출력의 **의미**를 바꾼다. alpha=1 로 한 번에 켜면 같은 raw 가
# 87mm 다른 곳을 가리켜(실측) 디코더가 무너진다. alpha=0 은 기존 경로와 bit-exact 이므로
# d3_joint 를 그대로 싣고 1,000 step 에 걸쳐 0 -> 1 로 올린 뒤 2,000 step 을 alpha=1 로 돈다.
#
# 왜 recon 단독인가: 이 단계의 질문은 "재매개화한 좌표에서도 디코더가 같은 정확도로 복원하는가"
# 하나다. 생성/SC 제약을 섞으면 무엇이 바뀌었는지 알 수 없다 (D1 이 같은 이유로 recon 단독이었다).
# 판정은 **eval 모드** recon RMSE 다 (train 모드 값은 BN 때문에 추론에서 성립하지 않는다).
#
# 주의: valid 는 1,569/3,321 뿐이고 나머지는 ROI centroid 직선 폴백이다. 그 쌍들에서는
# 앵커가 나쁜 초기값이므로 alpha=1 에서 손해가 날 수 있다 -- 결과를 valid/invalid 로 나눠 본다.
phase: d1_decoder         # active = {"recon"}
subjects: outputs/splits/train.txt
max_steps: 2500            # 마지막 체크포인트만 남으므로 max_steps 가 곧 모델 선택이다.
                           # 실측 최적: E8 gap 0.0704/식별 0.258 @2500, E6 0.0692 @2250,
                           # E4 는 2250 이후 붕괴. 2000 은 최적 **이전**이라 손해다.
out_dir: outputs/checkpoints/retrain/d4_anchor
trainable: vae
unet_level: none
t1_source: rigid
in_channels: 2
template: true
resume: outputs/checkpoints/retrain/df_prior/d3_joint_step2000.pt
log_every: 50
save_every: 500

train:
  # 앞 단계(E/D-f/A3)가 만든 가지를 전부 선언한다. 하나라도 빠지면 모델이 그 가지 없이
  # 만들어져 "checkpoint 에만 있는 키" 로 죽는다 (A3 스모크에서 실제로 겪었다).
  count_local_dim: 512
  count_tier1_dim: 9
  count_tier1_pair: true
  aux_local_dim: 512
  aux_tier1_dim: 9
  prior_local_dim: 512
  cond_local_dim: 512
  tier1_stats: outputs/cache/anat_tier1_pair_stats.npz

  bn_mode: eval           # D1 이 남긴 running 통계를 얼린다
  sc_mode: pass
  max_pairs_per_step: null
  chunk: 2048
  gt_pairs_per_step: 128
  n_gt_per_pair: 8
  lr_t1: 0.0
  lr_vae_enc: 1.0e-05
  lr_dec: 3.0e-05         # 좌표 의미가 바뀌므로 디코더에 D1 수준의 보폭을 준다
  lr_heads: 0.0
  grad_clip: 50.0
  seed: 0
  amp: bf16
  tf32: true
  cudnn_benchmark: true
  pair_anchor: true
  anchor_alpha: 0.0       # 시작값. 램프업이 덮어쓴다
  anchor_alpha_steps: 1000
  anchor_alpha_end: 1.0

loss:
  recon: 1.0
  kl: 0.1
  geom: 1.0
