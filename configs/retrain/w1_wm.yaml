# W1 백질 점유 — 생성 가닥이 백질을 관통하게 만든다
#
# 문제 (실측, val 3명, SyN 공간)
# ------------------------------
#                          GT      생성
#   중간구간 WM 점유 평균   0.825   0.393
#   중간구간 > 0.5 비율     0.864   0.358
#   백질까지 거리 평균      1.6mm   6.0mm
#   가닥당 방문 ROI         4.4     6.4     (raw 5.1 vs 8.1)
#
# WM 확률맵은 인코더 **입력 채널**로만 쓰고 있었고 생성을 제약하는 손실도 사후 필터도 없었다.
# 가닥 하나가 pair 20개에 count 를 더하는 바람에 배분에 실린 개인차의 pass SC 전달률이 0.27 이다.
#
# 손실: relu(target - guide(x)) 를 양끝 12.5% 를 뺀 구간에서 평균. guide 는 거리 램프 안내장이다
# (원 WM 확률로 걸면 백질 밖에서 기울기가 정확히 0 이라 학습이 안 된다 -- 합성/실데이터 둘 다 확인).
# 실데이터 검증: 생성 가닥이 8.7mm 이동하며 WM 점유 0.351 -> 0.984 (GT 0.766).
#
# 공간 주의: 안내장은 **SyN(NLin6)** 조직맵이다. GT 가닥이 QSDR/NLin6 공간에 있어서 rigid
# 조직맵을 쓰면 조직 경계가 어긋난다 (GT 점이 GM+WM 안: rigid 0.820 / syn 0.907).
phase: d3_joint
subjects: outputs/splits/train.txt
max_steps: 1000
out_dir: outputs/checkpoints/retrain/w1_wm
trainable: vae
unet_level: none          # 인코더(E8)는 고정. 22.4M 을 다시 흔들면 그 위 전부가 또 낡는다
t1_source: rigid
in_channels: 2
template: true
resume: outputs/checkpoints/retrain/j1_joint_noanchor/d3_joint_step1000.pt  # J1 (no-anchor). 여기에 백질 제약만 더한다
log_every: 50
save_every: 500

train:
  bn_mode: eval
  sc_mode: pass
  max_pairs_per_step: null
  chunk: 2048
  gt_pairs_per_step: 128
  n_gt_per_pair: 8
  lr_t1: 0.0
  lr_vae_enc: 3.0e-06
  lr_dec: 1.0e-05         # D4 의 1/3
  lr_heads: 1.0e-04       # A3 의 1/3
  lr_prior: 1.0e-04       # D-f 의 1/3
  tier1_lr: 3.0e-04       # pair 별 가중치 (tier1 / prior 저랭크) 의 1/3
  tier1_wd: 0.1
  grad_clip: 50.0
  seed: 0
  amp: bf16
  tf32: true
  cudnn_benchmark: true
  sc_groups: block
  resid_beta: 1.0
  resid_stats: outputs/cache/sc_template_stats.npz
  tier1_stats: outputs/cache/anat_tier1_pair_stats.npz
  anchor_alpha: 0.0       # 앵커 없음 (D4 폐기)
  wm_source: syn          # GT 가닥과 같은 공간. rigid 를 쓰면 조직 경계가 어긋난다
  wm_target: 0.9
  wm_interior: 0.125

loss:
  recon: 1.0
  kl: 0.1
  geom: 1.0
  endpoint: 1.0
  edge: 0.5
  corr: 0.5
  mag: 0.5
  length: 0.2
  route: 1.0
  route_gen: 0.5
  presence: 0.5
  seg_recon: 1.0
  seg_kl: 0.1
  seg_geom: 1.0
  seg_endpoint: 0.5
  gen_length: 1.0
  scale: 1.0
  rmse: 0.2
  count: 0.0              # pair 절대 count 손실은 계속 끈다 (템플릿으로 기울기가 샌다)
  count_end: 1.0
  res: 1.0
  res_corr: 0.2
  diff: 0.2
  prior: 0.1
  prior_res: 1.0
  prior_res_corr: 0.2
  seg_prior: 0.0
  wm_gen: 1.0             # 생성 가닥. 이 phase 의 목적
  wm_rec: 0.3             # 복원 가닥. GT 자체가 백질 안이라 값이 작아야 정상이다

gates:
  d3_joint:
  - metric: recon_rmse_eval_mm
    op: <=
    value: 4.6             # J1 실측 4.41. 백질 제약이 복원을 망가뜨리면 버린다
    n_key: n_val
    min_n: 3
