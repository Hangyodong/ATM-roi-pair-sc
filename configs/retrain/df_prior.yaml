# A2 template + residual — 전략 문서 §1·§4·§5 의 Phase 2 최소 실험
#
# 질문 (문서 §2.2):
#   T1 에 GT SC residual 을 설명할 재현 가능한 신호가 있으며, end-to-end residual supervision
#   으로 그 신호를 읽을 수 있는가?
#
# A1(53번) 과의 차이: A1 은 절대 count 손실을 켠 채 EMA 잔차 상관만 얹었다. 문서는 그 구성을
# 경계한다 -- SC 분산의 89.3% 가 그룹 상수라 절대 손실의 기울기가 거의 전부 "템플릿을 더 잘
# 맞춰라" 로 간다 (실측: P2 의 resid_r 0.124 가 P3 에서 corr/mag/scale 을 켜자 0.009 로 붕괴).
# 여기서는 **절대 손실을 끄고** (드라이버가 count weight 를 0 으로 덮어쓴다) 정규화 잔차만 맞춘다.
#
# 타깃 (문서 §1.2-1.4, train split 전용 -- outputs/cache/sc_template_stats.npz):
#   y = log1p(SC),  mu = mean_train(y),  sigma = std_train(y) (floor 0.1)
#   delta = (y - mu) / sigma          <- 이걸 예측한다
#   복원: SC_hat = expm1(mu + delta_hat * sigma)
# 실측: train 144명에서 잔차가 log1p SC 분산의 **25.7%**, 유효 edge 3,321/3,321.
#
# arm 은 드라이버 --arm 이 정한다 (문서 §4.5 의 ablation A~D). 아래 loss 블록의 res/res_corr/diff
# 는 그 기본값이고 드라이버가 덮어쓴다.
#
# 고정: decoder, prior, 생성 경로 (문서 §2.2). 학습되는 것은 count head 뿐이다.
phase: d3_joint          # prior 적합항이 살아있는 phase (D-f 의 지도는 그것이다)
subjects: outputs/splits/train.txt
max_steps: 2000
out_dir: outputs/checkpoints/retrain/df_prior
trainable: vae
unet_level: none          # UNet 동결 -> anatomy 는 디스크 캐시 (W4 프로브와 같은 512-d)
t1_source: rigid
in_channels: 2
template: true
resume: outputs/checkpoints/retrain/e4_unet_D_local_t1fp0.1/a1_resid_step3000.pt  # E8 (E 축 승자)
log_every: 50
save_every: 500

train:
  bn_mode: eval
  sc_mode: pass
  max_pairs_per_step: null
  chunk: 2048
  lr_t1: 0.0
  lr_vae_enc: 0.0
  lr_dec: 0.0
  lr_heads: 3.0e-05
  lr_prior: 3.0e-04       # prior 전용 (Adam 은 손실 가중치가 아니라 LR 로 보폭이 정해진다)
  grad_clip: 50.0
  seed: 0
  amp: bf16
  tf32: true
  cudnn_benchmark: true
  sc_groups: block
  resid_beta: 1.0
  # res/res_corr/diff 손실은 train 전용 log1p 템플릿을 요구한다 (data/sc_template.py).
  # 54번 드라이버는 이걸 코드에서 넣어주지만 49_d3_joint 는 config 에서 읽는다.
  resid_stats: outputs/cache/sc_template_stats.npz
  count_tier1_dim: 9
  count_tier1_pair: true
  tier1_stats: outputs/cache/anat_tier1_pair_stats.npz
  prior_local_dim: 512    # D-f: pair 의존 subject 조건부 prior
  prior_local_rank: 4     # ★ 공유 MLP 는 실패했다 (신호 0.566 중 0.000154 만 학습).
                          # pair 별 저랭크 [512->4->128], 3321*4*128 = 1.7M.
  tier1_wd: 0.1           # 1.7M / 144명 -- 정규화 없이는 과적합한다
  tier1_lr: 1.0e-03
  cond_local_dim: 512
  count_local_dim: 512         # SmoothL1 beta (정규화 잔차 단위이므로 1.0 = 1 sigma)

loss:
  count: 0.0              # 드라이버가 항상 0 으로 덮어쓴다 (문서 §4.5)
  res: 1.0
  res_corr: 0.2
  diff: 0.2
  # D-f 의 핵심. prior_local 은 **이 항 하나로만** gradient 를 받는다 -- KL 은 prior 를 detach 하고
  # (C11), 생성 경로는 log_sigma 를 detach 한다. prior: 0 으로 두면 subject 조건부 prior 가
  # 배선만 되고 한 step 도 학습되지 않는다. d3_joint 와 같은 0.1 을 쓴다 (64차 합 로그우도라
  # 값 자체가 커서 초기 ~65).
  prior: 0.1
  seg_prior: 0.0
  # D-f'' 의 핵심 -- subject 잔차 적합항. 왜 (실측): posterior mu 의 subject 잔차는 split-half
  # r=0.9956 으로 재현되는 진짜 신호인데, 위 prior 항 하나로는 pair 별 저랭크 가지를 달아도
  # subject 성분을 0.000525 (상한 0.566 의 0.09%) 만 배웠다. pair 평균이 손실을 압도한다.
  # count_head 에서 템플릿을 빼고 잔차만 맞춰 resid_r 0.009 -> 0.124 를 얻은 처방과 같다.
  prior_res: 1.0
  prior_res_corr: 0.2
