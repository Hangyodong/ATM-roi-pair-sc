# J1 joint fine-tune — 단계별로 얼려 두고 학습한 부품들을 **동시에** 낮은 LR 로 맞춘다
#
# 왜: staged 학습은 각 변경의 효과를 분리해 재기 위한 것이었다. 그 대가로 부품끼리 서로 맞춰질
# 기회가 없었다 -- 디코더는 옛 prior 에, count_head 는 옛 edge_head 가 고른 pair 위에서 학습됐다.
# d3_joint 문서가 지적한 "prior 가 뽑는 영역이 디코더가 정확한 영역이 아니게 된 것" 이 그대로다.
#
# 규칙: 모든 LR 을 각 단계의 1/3~1/10 로. val 에서 나빠지면 버린다 (게이트 아래).
# resume 은 파이프라인이 D4(성공 시) 또는 A3 checkpoint 로 덮어쓴다. 구조(어떤 가지가 있는지)는
# run.py 가 checkpoint 에서 물려받으므로 여기 선언하지 않는다.
phase: d3_joint
subjects: outputs/splits/train.txt
max_steps: 1000
out_dir: outputs/checkpoints/retrain/j1_joint_noanchor
trainable: vae
unet_level: none          # 인코더(E8)는 고정. 22.4M 을 다시 흔들면 그 위 전부가 또 낡는다
t1_source: rigid
in_channels: 2
template: true
resume: outputs/checkpoints/retrain/df_prior/d3_joint_step2000.pt  # D-f''' (A3 head 포함). D4 앵커는 recon 25.8mm 로 게이트 미달 -> 폐기
log_every: 50
save_every: 500

train:
  bn_mode: eval
  sc_mode: pass
  max_pairs_per_step: null
  chunk: 2048
  gt_pairs_per_step: 128
  n_gt_per_pair: 8
  lr_t1: 0.0
  lr_vae_enc: 3.0e-06
  lr_dec: 1.0e-05         # D4 의 1/3
  lr_heads: 1.0e-04       # A3 의 1/3
  lr_prior: 1.0e-04       # D-f 의 1/3
  tier1_lr: 3.0e-04       # pair 별 가중치 (tier1 / prior 저랭크) 의 1/3
  tier1_wd: 0.1
  grad_clip: 50.0
  seed: 0
  amp: bf16
  tf32: true
  cudnn_benchmark: true
  sc_groups: block
  resid_beta: 1.0
  resid_stats: outputs/cache/sc_template_stats.npz
  tier1_stats: outputs/cache/anat_tier1_pair_stats.npz
  anchor_alpha: 0.0       # 앵커 없음 (D4 폐기)

loss:
  recon: 1.0
  kl: 0.1
  geom: 1.0
  endpoint: 1.0
  edge: 0.5
  corr: 0.5
  mag: 0.5
  length: 0.2
  route: 1.0
  route_gen: 0.5
  presence: 0.5
  seg_recon: 1.0
  seg_kl: 0.1
  seg_geom: 1.0
  seg_endpoint: 0.5
  gen_length: 1.0
  scale: 1.0
  rmse: 0.2
  count: 0.0              # pair 절대 count 손실은 계속 끈다 (템플릿으로 기울기가 샌다)
  count_end: 1.0
  res: 1.0
  res_corr: 0.2
  diff: 0.2
  prior: 0.1
  prior_res: 1.0
  prior_res_corr: 0.2
  seg_prior: 0.0

gates:
  d3_joint:
  - metric: recon_rmse_eval_mm
    op: <=
    value: 4.6             # D-f'' 스모크 실측 4.611. joint 가 이걸 나쁘게 만들면 버린다
    n_key: n_val
    min_n: 3
